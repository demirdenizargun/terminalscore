version: 2

project_name: terminalscore

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # install.sh / install.ps1 bu isme göre indiriyor
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.tr.md

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: terminalscore
    vendor: demirdenizargun
    homepage: https://github.com/demirdenizargun/terminalscore
    maintainer: demirdenizargun <demirdenizargun@users.noreply.github.com>
    description: Live football scores in your terminal
    license: MIT
    formats: [deb, rpm]

changelog:
  abbrev: 7
  filters:
    exclude:
      - "^Merge"
